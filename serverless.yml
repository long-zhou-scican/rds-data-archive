service: data-service

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 900
  memorySize: 1536
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetBucketLocation
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${ssm:db-parquet-exports-${self:custom.${self:provider.stage}.envSuffix, 'sandbox'}}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${ssm:db-parquet-exports-${self:custom.${self:provider.stage}.envSuffix, 'sandbox'}}/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/*
custom:
  prod:
    subdomain: ''
    subdomainenabled: false
    mqttTopicEnv: 'P'
    recordsEventStreamShardCount: 1
    envSuffix: prod
    vpcSuffix: prod
    region: 'us-east-1'
  dr:
    subdomain: ''
    subdomainEnabled: false # Disable custom domain for DR stage
    mqttTopicEnv: 'P'
    recordsEventStreamShardCount: 1
    envSuffix: dr
    vpcSuffix: prod-dr
    region: 'us-west-2'
  qa:
    subdomain: '.qa'
    subdomainenabled: false
    mqttTopicEnv: 'Q'
    recordsEventStreamShardCount: 1
    envSuffix: qa
    vpcSuffix: qa
    region: 'us-east-1'
  dev:
    subdomain: '.dev'
    subdomainenabled: false
    mqttTopicEnv: 'D'
    recordsEventStreamShardCount: 1
    envSuffix: dev
    vpcSuffix: dev
    region: 'us-east-1'
  uat:
    subdomain: '.uat'
    subdomainenabled: false
    mqttTopicEnv: 'U'
    recordsEventStreamShardCount: 1
    envSuffix: uat
    vpcSuffix: uat
    region: 'us-east-1'
  customDomain:
    enabled: ${self:custom.${self:provider.stage}.subdomainEnabled, false}
    domainName: webservices${self:custom.${self:provider.stage}.subdomain, ''}.scicanapi.com
    basePath: 'data-archive'
    stage: ${self:provider.stage}
    createRoute53Record: true
package:
  individually: true
  patterns:
    - '!**'
    - dist-lambda/**
    - src/schedules/exportScheduleParams.json
    - datalayer/dist/**
    - datalayer/node_modules/**
    - '!datalayer/node_modules/duckdb/**'
    - '!datalayer/node_modules/@mapbox/node-pre-gyp/**'
    - '!datalayer/node_modules/node-addon-api/**'
    - '!datalayer/node_modules/typescript/**'
    - '!datalayer/node_modules/@types/**'
    - '!datalayer/node_modules/node-gyp/**'
    - '!datalayer/node_modules/**/src/**'
    - '!datalayer/node_modules/**/test/**'
    - '!datalayer/node_modules/**/tests/**'
    - '!datalayer/node_modules/**/docs/**'
    - '!datalayer/node_modules/**/example/**'
    - '!datalayer/node_modules/**/examples/**'
    - '!datalayer/node_modules/**/.github/**'
    - '!datalayer/node_modules/**/tsconfig*.json'
    - '!datalayer/node_modules/**/binding.gyp*'
    - '!datalayer/node_modules/**/vendor.py'
    - '!datalayer/node_modules/**/.mocharc.json'

layers:
  duckdb:
    name: ${self:service}-${sls:stage}-duckdb
    description: DuckDB runtime dependency layer
    path: layers/duckdb
    compatibleRuntimes:
      - nodejs20.x
    package:
      patterns:
        - '!**'
        - nodejs/node_modules/**
        - '!nodejs/node_modules/**/src/**'
        - '!nodejs/node_modules/**/test/**'
        - '!nodejs/node_modules/**/tests/**'
        - '!nodejs/node_modules/**/docs/**'
        - '!nodejs/node_modules/**/example/**'
        - '!nodejs/node_modules/**/examples/**'
        - '!nodejs/node_modules/**/.github/**'
        - '!nodejs/node_modules/**/tsconfig*.json'
        - '!nodejs/node_modules/**/binding.gyp*'
        - '!nodejs/node_modules/**/vendor.py'
        - '!nodejs/node_modules/**/.mocharc.json'

functions:
  genericDataSearch:
    name: ${self:service}-${sls:stage}-generic-data-search
    handler: dist-lambda/handlers/genericDataSearchHandler.handler
    description: Generic table data search by date range
    vpc: ${file(env.yml):vpc-${self:provider.stage}}
    timeout: 30
    layers:
      - { Ref: DuckdbLambdaLayer }
    environment:
      DB_HOST: ${ssm:rdsMySqlHost-${self:custom.${self:provider.stage}.envSuffix, 'sandbox'}}
      DB_PORT: ${param:dbPort, '3306'}
      DB_USER: ${ssm:rdsMySqlUsername-${self:custom.${self:provider.stage}.envSuffix, 'sandbox'}}
      DB_PASSWORD: ${ssm:rdsMySqlPassword-${self:custom.${self:provider.stage}.envSuffix, 'sandbox'}}
      DB_NAME: ${ssm:rdsMySqlDb-${self:custom.${self:provider.stage}.envSuffix, 'sandbox'}}
      region: ${self:custom.${self:provider.stage}.region, 'us-east-1'}
      S3_BUCKET: ${ssm:db-parquet-exports-${self:custom.${self:provider.stage}.envSuffix, 'sandbox'}}
    events:
      - httpApi:
          path: /generic-data-search
          method: post

  genericDynamoDbSearch:
    name: ${self:service}-${sls:stage}-generic-dynamodb-search
    handler: dist-lambda/handlers/genericDynamoDbSearchHandler.handler
    description: Generic DynamoDB search (get, query, scan)
    timeout: 30
    environment:
      region: ${self:custom.${self:provider.stage}.region, 'us-east-1'}
    events:
      - httpApi:
          path: /generic-dynamodb-search
          method: post

