sandbox:
  region: "us-east-1"
  PREFIX: "sandbox-"
  subdomain: ".sandbox"
  mqttTopicEnv: D
  cors:
    origins: "*"
    headers:
      - Content-Type
      - X-Coltene-Branch-Uuid
      - Authorization

dev:
  region: "us-east-1"
  dr_region: "us-west-1"
  PREFIX: "dev-"
  subdomain: ".dev"
  mqttTopicEnv: D
  stageName: "dev"
  cors:
    origins: "*"
    headers:
      - Content-Type
      - X-Coltene-Branch-Uuid
      - Authorization

qa:
  region: "us-east-1"
  PREFIX: "qa-"
  subdomain: ".qa"
  mqttTopicEnv: Q
  stageName: "qa"
  cors:
    origins: "*"
    headers:
      - Content-Type
      - X-Coltene-Branch-Uuid
      - Authorization

uat:
  region: "us-east-1"
  PREFIX: "uat-"
  subdomain: ".uat"
  mqttTopicEnv: U
  stageName: "uat"
  cors:
    origins: "*"
    headers:
      - Content-Type
      - X-Coltene-Branch-Uuid
      - Authorization

prod:
  region: "us-east-1"
  PREFIX: ""
  mqttTopicEnv: P
  stageName: ""
  cors:
    origins: "*"
    headers:
      - Content-Type
      - X-Coltene-Branch-Uuid
      - Authorization

mqttEndPoint: "${ssm:iot-endpoint}."

# Used for sending emails, on the method fnSendEmail
AWS_SES_REGION: ${file(env.yml):${self:provider.stage}.region}
AWS_SES_EMAIL_SENDER: "no-reply.notification@scican.com"

